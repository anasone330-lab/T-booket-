name: T-booket Smart AI Automation & Build

on:
  push:
    branches: [ main ]

jobs:
  smart-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install
          npm install @supabase/supabase-js

      - name: Run Local Auto-Fix Script
        run: |
          node auto-fix.js

      - name: Check or Generate Android Architecture
        run: |
          if [ ! -d "android" ]; then
            echo "مجلد أندرويد غير موجود، جاري توليده سحابياً..."
            npx @react-native-community/cli init TempApp --skip-install
            mv TempApp/android ./android
            rm -rf TempApp
          else
            echo "مجلد أندرويد موجود بالفعل، متابعة البناء..."
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
