name: T-booket Smart AI Automation & Build

on:
  push:
    branches: [ main ]

jobs:
  smart-automation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install
          npm install @supabase/supabase-js

      - name: Run Smart Auto-Healing & File Generator Script
        run: |
          node -e '
            const fs = require("fs");
            const path = require("path");

            console.log("🔍 جاري فحص ملفات المشروع وهيكليته...");

            // قائمة الملفات الأساسية وتأمين وجودها
            const filesToCheck = [
              { name: "App.js", content: "import React from \"react\"; import { View, Text } from \"react-native\"; export default function App() { return (<View><Text>T-booket Active</Text></View>); }" },
              { name: "Supabase.js", content: "import { createClient } from \"@supabase/supabase-js\"; export const supabase = createClient(\"YOUR_URL\", \"YOUR_KEY\");" }
            ];

            filesToCheck.forEach(file => {
              if (!fs.existsSync(file.name)) {
                console.log(`⚠️ الملف ${file.name} غير موجود، جاري إنشاؤه تلقائياً...`);
                fs.writeFileSync(file.name, file.content, "utf8");
              } else {
                console.log(`✅ الملف ${file.name} موجود وبحالة سليمة.`);
              }
            });

            console.log("✨ تمت عملية الأتمتة والفحص والتدقيق بنجاح!");
          '

      - name: Check or Generate Android Architecture
        run: |
          if [ ! -d "android" ]; then
            echo "مجلد أندرويد غير موجود، جاري توليده سحابياً..."
            npx @react-native-community/cli init TempApp --skip-install --yes
            mv TempApp/android ./android
            rm -rf TempApp
          else
            echo "مجلد أندرويد موجود بالفعل، متابعة البناء..."
          fi

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
