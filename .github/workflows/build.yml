name: T-booket Full Automation & Build

on:
  push:
    branches: [ main ]

jobs:
  automate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        run: |
          npm install
          npm install @supabase/supabase-js

      - name: Run Auto-Update & Code Validation Script
        run: |
          echo "جاري تشغيل محرك الأتمتة لفحص وتحديث الأكواد..."
          # هنا يمكنك وضع أي سكربت آلي لتعديل الملفات أو التحقق من صحتها
          node -e "console.log('Code structure verified successfully!')"

      - name: Auto-generate Android Architecture & Configs
        run: |
          npx @react-native-community/cli init TempApp --skip-install
          mv TempApp/android ./android
          rm -rf TempApp

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
