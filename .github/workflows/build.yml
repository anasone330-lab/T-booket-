name: Build Android APK with Supabase & Native Setup

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies & Supabase client
        run: |
          npm install
          npm install @supabase/supabase-js

      - name: Auto-generate Android Architecture & Configs
        run: |
          npx @react-native-community/cli init TempApp --skip-install
          mv TempApp/android ./android
          rm -rf TempApp

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
